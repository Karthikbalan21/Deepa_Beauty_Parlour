{% extends "dashboard/dashboard_base.html" %}

{% block dashboard_content %}

<div class="card shadow">

    <div class="card-header bg-success text-white">

        <h3>Edit Profile</h3>

    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                class="btn btn-success">

                Save Changes

            </button>

            <a href="{% url 'profile' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
