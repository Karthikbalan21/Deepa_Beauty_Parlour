<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d1d"><title>{% block title %}SalonSync | Luxury Salon Studio{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"><link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
<style>
:root{--bg:#100d1d;--bg-soft:#18142a;--surface:rgba(31,25,53,.72);--surface-solid:#211b38;--ink:#f8f5ff;--muted:#b8b0ca;--line:rgba(255,255,255,.12);--primary:#ab75ff;--gold:#ffc978;--pink:#ff86ae;--shadow:0 22px 60px rgba(0,0,0,.28)}[data-theme="light"]{--bg:#f9f7ff;--bg-soft:#eee9fb;--surface:rgba(255,255,255,.76);--surface-solid:#fff;--ink:#29223e;--muted:#6e6580;--line:rgba(61,42,101,.12);--shadow:0 22px 55px rgba(54,31,103,.12)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{min-height:100vh;background:radial-gradient(circle at 5% 5%,#703b963d,transparent 25rem),radial-gradient(circle at 95% 15%,#286cae30,transparent 28rem),var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}.navbar{background:rgba(17,13,31,.7)!important;backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;margin:12px auto;width:min(1140px,calc(100% - 24px));box-shadow:var(--shadow)}[data-theme="light"] .navbar{background:rgba(255,255,255,.7)!important}.navbar-brand,.page-title,h1,h2,h3{font-family:"Playfair Display",serif}.navbar-brand{color:var(--ink)!important}.nav-link{color:var(--muted)!important}.nav-link:hover{color:var(--gold)!important}.main-shell{padding-top:6rem}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);color:var(--ink);backdrop-filter:blur(14px);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}.card:hover{transform:translateY(-4px);border-color:#c699ff66;box-shadow:0 28px 70px rgba(0,0,0,.34)}.card-header{background:linear-gradient(110deg,#7d45c9aa,#d66d92aa)!important;border-bottom:1px solid var(--line)!important;color:white!important}.metric{position:relative;overflow:hidden;padding:1.35rem}.metric:after{content:"";position:absolute;width:110px;height:110px;right:-45px;bottom:-55px;background:radial-gradient(circle,var(--primary),transparent 70%);opacity:.32}.metric h2,.metric h3{position:relative;z-index:1;color:var(--gold)}.text-muted,.form-text,small{color:var(--muted)!important}.btn{border-radius:13px;padding:.62rem 1rem;font-weight:700;border:0;transition:.2s transform,.2s box-shadow;position:relative;overflow:hidden}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px #8f5fff44}.btn-primary,.btn-success{background:linear-gradient(110deg,#8259ea,#d06cac)!important;color:white}.btn-secondary,.btn-outline-secondary{background:var(--surface-solid);color:var(--ink);border:1px solid var(--line)}.btn-outline-primary,.btn-outline-success{color:var(--gold);border:1px solid #ffc97877;background:transparent}.btn-outline-danger{color:#ff9ab7;border:1px solid #ff719477;background:transparent}.form-control,.form-select{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:13px;color:var(--ink);padding:.7rem .85rem}.form-control:focus,.form-select:focus{background:rgba(255,255,255,.11);color:var(--ink);border-color:var(--primary);box-shadow:0 0 0 .25rem #9f6cff22}.form-select option{background:var(--surface-solid);color:var(--ink)}.form-check-input{background-color:transparent;border-color:var(--muted)}.form-check-input:checked{background-color:var(--primary);border-color:var(--primary)}.table{--bs-table-bg:transparent;--bs-table-color:var(--ink);--bs-table-border-color:var(--line);--bs-table-hover-bg:rgba(180,133,255,.09);--bs-table-hover-color:var(--ink)}.table>*>*{padding:1rem .75rem}.list-group-item{background:transparent!important;color:var(--muted)!important;border:0!important;border-radius:12px!important;margin:.15rem}.list-group-item:hover,.list-group-item.active{background:linear-gradient(90deg,#8557ea35,transparent)!important;color:var(--ink)!important}.badge{border-radius:99px;padding:.42rem .7rem}.alert{background:var(--surface-solid);color:var(--ink);border:1px solid var(--line);border-radius:16px}.toast{background:var(--surface-solid);color:var(--ink);border:1px solid #c68bff66;border-radius:15px}.sidebar{position:sticky;top:6rem}.auth-shell{min-height:calc(100vh - 10rem);display:grid;place-items:center}.auth-card{max-width:510px;width:100%;padding:1.1rem}.auth-orb{position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(50px);background:#8e55ff38;z-index:-1}.loading-bar{height:3px;position:fixed;top:0;left:0;width:100%;z-index:2000;background:linear-gradient(90deg,transparent,var(--gold),var(--pink),transparent);background-size:200% 100%;animation:glide 1.7s infinite}@keyframes glide{to{background-position:-200%}}@media(max-width:991px){.sidebar{position:static}.main-shell{padding-top:5.6rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.icon-dot{width:54px;height:54px;display:grid;place-items:center;border-radius:18px;color:var(--gold);font-size:1.35rem;background:linear-gradient(135deg,#a969f544,#ffc97833);border:1px solid #ffc97855;box-shadow:inset 0 1px #fff3}</style></head>
<body><div class="loading-bar"></div><nav class="navbar navbar-expand-lg navbar-dark px-3"><a class="navbar-brand fw-bold" href="{% url 'home' %}"><i class="bi bi-stars me-1 text-warning"></i>SalonSync</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">{% if user.is_authenticated %}<a class="nav-link" href="{% url 'dashboard' %}"><i class="bi bi-grid me-1"></i>Workspace</a><a class="nav-link" href="{% url 'profile' %}">{{ user.username }}</a><a href="{% url 'logout' %}" class="btn btn-outline-secondary btn-sm">Logout</a>{% else %}<a class="nav-link" href="{% url 'login' %}">Login</a><a href="{% url 'register' %}" class="btn btn-primary btn-sm">Get started</a>{% endif %}<button class="btn btn-outline-secondary btn-sm ms-lg-1" id="themeToggle" type="button" aria-label="Toggle colour theme"><i class="bi bi-sun"></i></button></div></div></nav><main class="container main-shell">{% if messages %}<div class="toast-container position-fixed top-0 end-0 p-3">{% for message in messages %}<div class="toast show mb-2" role="alert"><div class="d-flex"><div class="toast-body"><i class="bi bi-sparkles me-2 text-warning"></i>{{ message }}</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>{% endfor %}</div>{% endif %}<div data-aos="fade-up" data-aos-duration="550">{% block content %}{% endblock %}</div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script><script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script><script>AOS.init({once:true,offset:10});const root=document.documentElement,toggle=document.getElementById('themeToggle'),saved=localStorage.getItem('salonsync-theme');if(saved)root.dataset.theme=saved;toggle?.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='light'?'dark':'light';localStorage.setItem('salonsync-theme',root.dataset.theme);toggle.innerHTML=root.dataset.theme==='light'?'<i class="bi bi-moon-stars"></i>':'<i class="bi bi-sun"></i>'});document.querySelectorAll('form').forEach(form=>form.addEventListener('submit',()=>{const btn=form.querySelector('button[type=submit]');if(btn&&!btn.dataset.loading){btn.dataset.loading='1';btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>Working…'}}));document.querySelectorAll('.btn').forEach(button=>button.addEventListener('pointerdown',event=>{const ripple=document.createElement('span');ripple.style.cssText='position:absolute;border-radius:50%;background:#ffffff66;width:15px;height:15px;left:'+event.offsetX+'px;top:'+event.offsetY+'px;transform:scale(0);animation:ripple .55s linear;pointer-events:none';button.append(ripple);setTimeout(()=>ripple.remove(),600)}));</script><style>@keyframes ripple{to{transform:scale(14);opacity:0}}</style></body></html>
